name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check and build
        run: cd frontend && npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  build-backend:
    name: Backend import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Verify app imports and routes resolve
        working-directory: backend
        run: |
          python -c "
          from backend.main import create_application
          app = create_application()
          paths = sorted(r.path for r in app.routes if hasattr(r, 'path'))
          print('route count:', len(paths))
          for p in paths:
              if p.startswith('/api/system') or p in ('/api/services','/api/hosts','/api/storage','/api/ai/command-center','/api/projects','/api/alerts','/api/activity','/api/quick-actions','/api/search','/api/infrastructure/snapshot'):
                  print('  OK', p)
          "

      - name: Upload backend code
        uses: actions/upload-artifact@v4
        with:
          name: backend-code
          path: backend/
          retention-days: 7